name: Daily Job Search

on:
  schedule:
    # GitHub Actions cron always runs in UTC, and Pakistan Time (PKT) is a
    # fixed UTC+5 all year (no daylight saving), so 8:00 AM PKT = 3:00 AM UTC.
    # "1-5" is Monday through Friday.
    - cron: "0 3 * * 1-5"
  workflow_dispatch: {}  # adds a "Run workflow" button for on-demand testing

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job-search agent
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: python main.py
